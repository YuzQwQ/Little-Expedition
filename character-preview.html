<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>战士组装预览 · Little Expedition</title>
    <link rel="stylesheet" href="/src/character/preview.css">
</head>
<body>
    <header class="page-heading">
        <a href="./">Little Expedition</a>
        <h1>战士组装预览</h1>
    </header>
    <main>
        <section class="stage" aria-label="原图与组装角色对照">
            <div class="actions" aria-label="角色动画">
                <button type="button" data-motion="idle" aria-pressed="true">待机</button>
                <button type="button" data-motion="walk" aria-pressed="false">行走</button>
                <button type="button" data-motion="attack" aria-pressed="false">普攻</button>
                <button type="button" data-motion="guard" aria-pressed="false">格挡</button>
                <label class="check"><input id="mirror" type="checkbox"> 左右镜像</label>
            </div>
            <div id="preview-canvas"></div>
        </section>
        <aside class="inspector" aria-label="组装参数">
            <h2>组装参数</h2>
            <label class="part-label" for="part">部件</label>
            <select id="part"></select>
            <div id="fields" class="fields"></div>
            <div class="view-options">
                <label class="check"><input id="visible" type="checkbox" checked> 显示部件</label>
                <label class="check"><input id="pivot" type="checkbox"> 标出锚点</label>
            </div>
            <p class="hint">偏移以脚底原点为准。锚点以部件宽高的比例表示，左上角为 0, 0。</p>
            <div class="files">
                <button id="export" type="button">导出 JSON</button>
                <button id="import" type="button">加载 JSON</button>
                <button id="reset" type="button">重置</button>
                <input id="file" type="file" accept="application/json,.json" hidden>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
        </aside>
    </main>
    <script type="module" src="/src/character/main.ts"></script>
</body>
</html>
